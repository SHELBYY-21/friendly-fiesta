# ============================================================
# Render Blueprint — CE VAULT (Next.js dashboard + Telegram webhook bot)
# Deploy: https://dashboard.render.com/blueprint/new?repo=https://github.com/callmeboss721-ops/friendly-fiesta
#
# Catatan:
# - Web service memakai plan free (spin-down setelah 15 menit idle;
#   pesan Telegram pertama setelah idle butuh ~1 menit cold start).
#   Upgrade ke plan starter untuk bot yang selalu aktif.
# - Cron job day-cut berbayar minimum $1/bulan (Render tidak punya cron gratis).
# - Semua nilai `sync: false` wajib diisi di Dashboard saat Apply.
# - Setelah live, aktifkan webhook Telegram satu kali:
#   curl -X POST https://<service>.onrender.com/api/telegram/set-webhook -H "x-api-key: <API_SECRET>"
# ============================================================
services:
  - type: web
    name: ce-vault
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL publik service ini (ganti jika nama service berubah / pakai custom domain)
      - key: APP_URL
        value: https://ce-vault.onrender.com
      - key: SUPABASE_BUCKET
        value: slips
      - key: ALLOW_INSECURE_DEV_API
        value: "0"
      - key: DEFAULT_SELL_RATE
        value: "35.5"
      - key: DEFAULT_MARKET_RATE
        value: "34.8"
      - key: FEE_WARNING_THRESHOLD
        value: "3"
      - key: OCR_AUTO_MIN
        value: "90"
      - key: GROK_MODEL
        value: grok-4.20-non-reasoning
      # Rahasia yang dibuat otomatis oleh Render saat Apply
      - key: API_SECRET
        generateValue: true
      # Wajib beda dari API_SECRET dan hanya [A-Za-z0-9_-] (16-256 char).
      # Isi manual dengan: openssl rand -hex 32
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Rahasia Supabase (Project Settings -> API)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Telegram
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: NOTIFY_CHAT_ID
        value: ""
      # Gerbang PIN dashboard
      - key: DASHBOARD_PIN
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        sync: false
      # OCR / Vision
      - key: GROK_API_KEY
        sync: false

  # Tutup hari otomatis 22:00 waktu Thailand (15:00 UTC) — pengganti Netlify scheduled function
  - type: cron
    name: ce-vault-day-cut
    runtime: node
    schedule: "0 15 * * *"
    buildCommand: echo "no build needed"
    startCommand: curl -fsS -H "Authorization: Bearer $API_SECRET" "$APP_URL/api/cron/day-cut"
    envVars:
      - key: API_SECRET
        fromService:
          name: ce-vault
          type: web
          envVarKey: API_SECRET
      - key: APP_URL
        fromService:
          name: ce-vault
          type: web
          envVarKey: APP_URL

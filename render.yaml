# ============================================================
# Render Blueprint — CE VAULT (Next.js dashboard + Telegram webhook bot)
# Deploy: https://dashboard.render.com/blueprint/new?repo=https://github.com/callmeboss721-ops/friendly-fiesta
#
# หลังกด Apply:
# 1. รอจน service เป็น Live แล้วตั้ง APP_URL เป็น URL สาธารณะที่ Render ให้
#    ถ้าไม่ใช่ https://ce-vault.onrender.com
# 2. เปิด webhook Telegram ครั้งเดียว:
#    curl -X POST "$APP_URL/api/telegram/set-webhook" -H "x-api-key: $API_SECRET"
# 3. ตรวจความพร้อม: curl "$APP_URL/api/health"  →  {"status":"ok",...}
#
# หมายเหตุ:
# - แผน free จะ spin-down หลังว่าง 15 นาที (cold start ประมาณ 1 นาที)
#   อัปเกรดเป็น starter ถ้าต้องการให้บอท Telegram ออนไลน์ตลอด
# - Cron day-cut มีค่าใช้จ่าย (~$1/เดือน) ลบบล็อก cron ด้านล่างได้ถ้าใช้แค่เว็บฟรี
# ============================================================
services:
  - type: web
    name: ce-vault
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # หน้าแรกต้องตอบ 200 เสมอ — /api/health ใช้ตรวจความพร้อมหลังใส่ secret ครบ
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://ce-vault.onrender.com
      - key: SUPABASE_BUCKET
        value: slips
      - key: ALLOW_INSECURE_DEV_API
        value: "0"
      - key: DEFAULT_SELL_RATE
        value: "35.5"
      - key: DEFAULT_MARKET_RATE
        value: "34.8"
      - key: FEE_WARNING_THRESHOLD
        value: "3"
      - key: OCR_AUTO_MIN
        value: "90"
      - key: GROK_MODEL
        value: grok-4.20-non-reasoning
      - key: NOTIFY_CHAT_ID
        value: ""
      - key: API_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: DASHBOARD_PIN
        sync: false
      - key: GROK_API_KEY
        sync: false

  - type: cron
    name: ce-vault-day-cut
    runtime: node
    schedule: "0 15 * * *"
    buildCommand: echo "no build needed"
    startCommand: curl -fsS -H "Authorization: Bearer $API_SECRET" "$APP_URL/api/cron/day-cut"
    envVars:
      - key: API_SECRET
        fromService:
          name: ce-vault
          type: web
          envVarKey: API_SECRET
      - key: APP_URL
        fromService:
          name: ce-vault
          type: web
          envVarKey: APP_URL
